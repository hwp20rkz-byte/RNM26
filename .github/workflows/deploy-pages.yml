name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/qazaqosi-tariff-calculator-pgkunt
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # HOA yard-maintenance service — unrelated app, own package.json, published
      # alongside QazaqOSI on the same Pages site under /hoa-yard-service/ instead
      # of getting its own Pages deployment (a repo only gets one).
      - name: Install HOA frontend dependencies
        working-directory: hoa-yard-service/frontend
        run: npm ci

      - name: Build HOA frontend
        working-directory: hoa-yard-service/frontend
        env:
          GITHUB_PAGES_BASE: /RNM26/hoa-yard-service/
        run: npm run build

      - name: Merge HOA build into Pages output
        run: |
          mkdir -p out/hoa-yard-service
          cp -r hoa-yard-service/frontend/dist/. out/hoa-yard-service/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
