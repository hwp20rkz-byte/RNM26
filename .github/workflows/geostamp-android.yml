name: GeoStamp Android

on:
  push:
    paths:
      - "geostamp-android/**"
      - ".github/workflows/geostamp-android.yml"
  pull_request:
    paths:
      - "geostamp-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: geostamp-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: geostamp-debug-apk
          path: geostamp-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
